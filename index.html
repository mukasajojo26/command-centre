<style>

 --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f1517;--surface:#172024;--surface2:#1b262b;--ink:#e8eeef;--muted:#9aa9b0;--line:#2a373d;
 --brand:#4fb3b6;--brand2:#2f8e91;--brandink:#062022;--accent:#e0a94e;
 --ok:#6fd39a;--okbg:#173a28;--warn:#f0c15a;--warnbg:#3b2f10;--bad:#ff8f8f;--badbg:#421c1c;
 --hi:#ffab7d;--hibg:#43250f;--extbg:#c2345f;--ext:#fff;--info:#7cb8ee;--infobg:#132c44;

*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:0;letter-spacing:.1px}
h2{font-size:19px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brandink);display:grid;place-items:center;flex:none}

.ck i{font-style:normal;width:22px;flex:none}
.ai-r{display:flex;gap:6px}
.ai-r .btn{flex:1;padding:8px 4px}
.ai-r .btn.p{background:var(--okbg);color:var(--ok)}.ai-r .btn.f{background:var(--badbg);color:var(--bad)}.ai-r .btn.n{background:var(--surface2)}

.acc summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;display:flex;justify-content:space-between;gap:8px}

.tw2{overflow-x:auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand2);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}

.tile.r-low{background:var(--okbg);border-color:transparent}.tile.r-warn{background:var(--warnbg);border-color:transparent}.tile.r-hi{background:var(--hibg);border-color:transparent}.tile.r-ext{background:var(--extbg);color:var(--ext);border-color:transparent}.tile.r-ok{background:var(--okbg);border-color:transparent}

  <div style="min-width:0"><h1 id="appName">Cluster SRM Command Centre</h1><small id="hotelLine">Security · Safety · Risk — 5-star resort cluster</small></div>
 </div>
 <span class="pill" id="aiPill">AI …</span>
 <button class="icon" id="acct" title="Account" aria-label="Account" style="font-size:12px;font-weight:700">👤</button>
 <button class="icon" id="gear" title="Settings" aria-label="Settings">⚙</button>
</header>

<main id="main"></main>

<script>
'use strict';
const STANDALONE=!!window.__STANDALONE;
/* ============ CORE ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=s?new Date(s+'T12:00:00'):new Date();d.setDate(d.getDate()+n);return ymd(d)};
const nowLocal=()=>{const d=new Date();return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtDT=s=>{if(!s)return'';const d=new Date(s);return isNaN(d)?esc(s):d.toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})};
const fmtD=s=>{if(!s)return'';const d=new Date(s.length<=10?s+'T12:00:00':s);return isNaN(d)?esc(s):d.toLocaleDateString([], {day:'2-digit',month:'short',year:'numeric'})};
const daysTo=s=>s?Math.round((new Date(s.slice(0,10)+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5):null;
const hrsSince=s=>(Date.now()-new Date(s).getTime())/36e5;
const chip=(t,c='')=>`<span class="chip ${c}">${esc(t)}</span>`;

const readDU=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
async function thumb(file,max=560,q=.55){const du=await readDU(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=du});const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
function duBlob(du){const [h,b]=du.split(',');const m=/data:([^;]+)/.exec(h)[1];const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:m})}

const LIBS={jszip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'};
const loaded={};
const lib=n=>loaded[n]||(loaded[n]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIBS[n];s.onload=res;s.onerror=()=>{delete loaded[n];rej(new Error('Could not load '+n+' reader'))};document.head.appendChild(s)}));
async function readFileText(f){
 const n=f.name.toLowerCase();
 if(/\.(txt|md|csv|tsv|json|log|html?|xml|rtf)$/.test(n)||f.type.startsWith('text/'))return await f.text();
 if(n.endsWith('.docx')){await lib('jszip');const z=await JSZip.loadAsync(await f.arrayBuffer());const x=await z.file('word/document.xml').async('string');
  return x.replace(/<w:tab\/>/g,'\t').replace(/<\/w:tc>/g,' | ').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")}
 if(/\.xlsx?$/.test(n)){await lib('xlsx');const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return wb.SheetNames.map(s=>'## Sheet: '+s+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[s])).join('\n')}
 if(n.endsWith('.pdf')){await lib('pdf');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const d=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let t='';for(let p=1;p<=Math.min(d.numPages,40);p++){const c=await(await d.getPage(p)).getTextContent();t+='\n[p'+p+'] '+c.items.map(i=>i.str).join(' ')}return t}
 throw new Error('Unsupported file type: '+f.name);
}

/* ---------- markdown ---------- */
function inl(s){s=esc(s);s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/&lt;br\s*\/?&gt;/gi,'<br>');return s.replace(/\[TO BE CONFIRMED\]/g,'<mark style="background:#ffe08a">[TO BE CONFIRMED]</mark>')}
const splitRow=l=>{l=l.trim();if(l.startsWith('|'))l=l.slice(1);if(l.endsWith('|'))l=l.slice(0,-1);return l.split('|').map(c=>c.trim())};
function listHTML(b){let h='',st=[];for(const it of b){while(st.length&&it.ind<st[st.length-1].ind){h+='</li></'+st.pop().tag+'>'}
 if(st.length&&it.ind===st[st.length-1].ind){h+='</li>'}else if(!st.length||it.ind>st[st.length-1].ind){const tag=it.ord?'ol':'ul';h+='<'+tag+'>';st.push({ind:it.ind,tag})}
 let t=it.text;t=t.replace(/^\[ \]\s*/,'☐ ').replace(/^\[[xX]\]\s*/,'☑ ');h+='<li>'+inl(t)}
 while(st.length)h+='</li></'+st.pop().tag+'>';return h}
function md2html(md){
 const L=String(md||'').replace(/\r/g,'').split('\n');const out=[];let i=0;
 while(i<L.length){const l=L[i];
  if(/^\s*$/.test(l)){i++;continue}
  if(/^\s*```/.test(l)){let c=[];i++;while(i<L.length&&!/^\s*```/.test(L[i])){c.push(L[i]);i++}i++;out.push('<pre>'+esc(c.join('\n'))+'</pre>');continue}
  let m=l.match(/^(#{1,6})\s+(.*)$/);if(m){out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);i++;continue}
  if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){out.push('<hr>');i++;continue}
  if(/^\s*\|/.test(l)&&i+1<L.length&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i+1])){
   const head=splitRow(l);i+=2;const rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(splitRow(L[i]));i++}
   out.push('<div class="tw"><table><thead><tr>'+head.map(c=>`<th>${inl(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+head.map((_,k)=>`<td>${inl(r[k]??'')}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');continue}
  if(/^\s*>/.test(l)){const q=[];while(i<L.length&&/^\s*>/.test(L[i])){q.push(L[i].replace(/^\s*>\s?/,''));i++}out.push('<blockquote>'+q.map(inl).join('<br>')+'</blockquote>');continue}
  if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){const b=[];while(i<L.length&&/^\s*([-*+]|\d+[.)])\s+/.test(L[i])){const mm=L[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);b.push({ind:mm[1].replace(/\t/g,'  ').length,ord:/\d/.test(mm[2]),text:mm[3]});i++}out.push(listHTML(b));continue}
  const p=[l];i++;while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#{1,6}\s|\s*\||\s*>|\s*([-*+]|\d+[.)])\s|\s*```|\s*(-{3,}|\*{3,})\s*$)/.test(L[i])){p.push(L[i]);i++}
  out.push('<p>'+p.map(inl).join('<br>')+'</p>')}
 return out.join('\n')}

function modal(title,body,foot=''){const el=document.createElement('div');el.className='backdrop';el.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="sh-h"><h2>${esc(title)}</h2><button class="icon" data-close aria-label="Close">✕</button></div><div class="sh-b">${body}</div>${foot?`<div class="sh-f">${foot}</div>`:''}</div>`;
 el.addEventListener('click',e=>{if(e.target===el||e.target.closest('[data-close]'))el.remove()});$('#sheetRoot').appendChild(el);return el}
function sheet(cfg){
 const v=cfg.values||{};let photos=[...(v.photos||[])];
 const fld=f=>{const val=v[f.k]??f.def??'';const id='f_'+f.k;
  if(f.t==='area')return `<label class="fld full"><span>${f.l}</span><textarea id="${id}" ${f.dis?'disabled':''} rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea></label>`;
  if(f.t==='select')return `<label class="fld ${f.full?'full':''}"><span>${f.l}</span><select id="${id}" ${f.dis?'disabled':''}>${f.opts.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`}).join('')}</select></label>`;
  if(f.t==='check')return `<label class="fld chk"><input type="checkbox" id="${id}" ${val?'checked':''}> ${f.l}</label>`;
  if(f.t==='photos')return `<div class="fld full"><span>${f.l}</span><div id="phs" class="thumbs"></div><label class="btn ghost small">📷 Add photo<input type="file" accept="image/*" multiple hidden id="phIn"></label></div>`;
  return `<label class="fld ${f.full?'full':''}"><span>${f.l}${f.req?' *':''}</span><input id="${id}" ${f.dis?'disabled':''} type="${f.t||'text'}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.list?`list="${f.list}"`:''} ${f.t==='number'?'inputmode="decimal"':''}></label>`};
 const foot=`<button class="btn primary" data-save>Save</button><button class="btn ghost" data-close>Cancel</button>${(cfg.extra||[]).map((x,i)=>`<button class="btn" data-x="${i}">${x.l}</button>`).join('')}${cfg.onDelete?'<button class="btn bad ghost" data-del style="margin-left:auto">Delete</button>':''}`;
 const el=modal(cfg.title,`<div class="fgrid">${cfg.fields.map(fld).join('')}</div>${cfg.note?`<p class="hint">${cfg.note}</p>`:''}`,foot);
 const drawPh=()=>{const p=$('#phs',el);if(p)p.innerHTML=thumbsHTML(photos,true)};drawPh();
 el.addEventListener('click',e=>{const rm=e.target.closest('[data-rm]');if(rm){photos.splice(+rm.dataset.rm,1);drawPh()}});
 const pin=$('#phIn',el);if(pin)pin.onchange=async()=>{for(const f of [...pin.files]){if(photos.length>=3){toast('Max 3 photos per record');break}try{photos.push(await thumb(f))}catch(e){toast('Could not read photo')}}pin.value='';drawPh()};
 const gather=()=>{const o={};for(const f of cfg.fields){if(f.t==='photos'){o.photos=photos;continue}const e=$('#f_'+f.k,el);if(f.t==='check')o[f.k]=e.checked;else if(f.num||f.t==='number')o[f.k]=e.value===''?null:Number(e.value);else o[f.k]=e.value.trim()}return o};
 try{addMics(el)}catch(e){}
 if(cfg.readonly){$$('input,select,textarea',el).forEach(x=>x.disabled=true);$$('[data-save],[data-del],[data-x],label.btn',el).forEach(x=>x.remove());const t=$('.sh-h h2',el);if(t)t.textContent+=' (read-only)'}
 const svb=$('[data-save]',el);if(svb)svb.onclick=()=>{const o=gather();for(const f of cfg.fields){if(f.req&&!o[f.k]){toast(f.l+' is required');$('#f_'+f.k,el).focus();return}}cfg.onSave(o);el.remove()};
 $$('[data-x]',el).forEach(b=>b.onclick=()=>cfg.extra[+b.dataset.x].fn(gather(),el));
 const d=$('[data-del]',el);if(d)d.onclick=()=>twoTap(d,()=>{cfg.onDelete();el.remove()});
 return el}

const resid=r=>(r.rL||0)*(r.rS||0);

function conFlags(c){const f=[];if(!['Active','Planned'].includes(c.status))return f;
 if(!c.insExp)f.push(['No insurance date','warn']);else{const d=daysTo(c.insExp);if(d<0)f.push(['Insurance expired','bad']);else if(d<=30)f.push(['Insurance expires in '+d+'d','warn'])}
 if(c.status==='Active'){if(c.rams!=='Approved')f.push(['RAMS not approved','bad']);if(!c.induction)f.push(['No induction','bad']);if(c.end&&c.end<today())f.push(['Past end date','warn']);if(!c.oshad)f.push(['No HSE registration ref','warn'])}
 return f}
function permFlags(p){const f=[];if(p.status!=='Active')return f;if(p.end&&new Date(p.end)<new Date())f.push(['EXPIRED — still open','bad']);
 if(p.type==='Fire system impairment'&&p.start){const h=Math.round(hrsSince(p.start));f.push(['Fire system impaired '+h+'h',h>=8?'bad':'warn'])}return f}

function riskAI(preset){if(!AI.fn){riskLibSheet(typeof preset==='string'?preset:'');return}
 let files=[],thumbs=[];const el=modal('AI hazard scan & risk suggestions',`<p class="hint">Add photos of an area (optional) and/or a description. The AI proposes register entries — you review and choose what to add. Photos are analysed only for what is visible; always verify on site.</p>
 <label class="fld"><span>Area / department</span><input id="ra_area" list="dl_areas" placeholder="e.g. Main kitchen"></label>
 <label class="fld" style="margin-top:8px"><span>Notes / context</span><textarea id="ra_notes" rows="2" placeholder="Optional: activities, concerns, incident history"></textarea></label>
 <div class="thumbs" id="ra_th"></div><div class="row"><label class="btn ghost small">📷 Add photos<input id="ra_f" type="file" accept="image/*" multiple hidden></label><button class="btn primary small" id="ra_go">Analyse</button></div><div id="ra_out" style="margin-top:10px"></div>`);
 const draw=()=>{$('#ra_th',el).innerHTML=thumbsHTML(thumbs,true)};
 el.addEventListener('click',e=>{const rm=e.target.closest('[data-rm]');if(rm){files.splice(+rm.dataset.rm,1);thumbs.splice(+rm.dataset.rm,1);draw()}});
 $('#ra_f',el).onchange=async e=>{for(const f of [...e.target.files]){if(files.length>=(AI.lim?.images?.maxCount||4))break;files.push(f);try{thumbs.push(await thumb(f,300))}catch(x){thumbs.push('')}}e.target.value='';draw()};
 if(preset)$('#ra_area',el).value=preset;
 $('#ra_go',el).onclick=async()=>{const area=$('#ra_area',el).value.trim(),notes=$('#ra_notes',el).value.trim();const out=$('#ra_out',el);
  if(!area&&!files.length&&!notes){toast('Add an area, notes or photos');return}
  out.innerHTML='<span class="spin"></span> Analysing… (can take up to a minute)';
  const prompt=frame()+`\nTASK: Identify hazards and risks for the area below${files.length?` and from the ${files.length} attached photo(s) (describe only what is visible; do not identify people)`:''}.\nAREA: ${area||'(see photos)'}\nNOTES: ${notes||'(none)'}\nReturn ONLY a JSON array (max 10 items, most significant first). Each item: {"photo":number or 0,"hazard":string,"category":one of ${JSON.stringify(RISK_CATS)},"description":string,"existing":string (controls visible or typical),"L":1-5,"S":1-5,"addl":string (additional controls, hierarchy of controls),"rL":1-5,"rS":1-5 (residual after additional controls),"priority":"Critical|High|Medium|Low","actionTitle":string,"owner":string (role)}. Return [] if nothing significant.`;
  try{const arr=await ask(prompt,{images:files,json:true,tier:files.length?'default':'default'});
   if(!Array.isArray(arr)||!arr.length){out.innerHTML='<p class="hint">Nothing significant identified.</p>';return}
   const clamp=n=>Math.min(5,Math.max(1,Math.round(+n||3)));
   const items=arr.slice(0,10).map(x=>({...x,L:clamp(x.L),S:clamp(x.S),rL:clamp(x.rL),rS:clamp(x.rS)}));
   out.innerHTML=items.map((x,i)=>{const [n,c]=band(x.rL*x.rS),[n0,c0]=band(x.L*x.S);return `<label class="rc" style="cursor:default"><div class="rc-top"><input type="checkbox" data-i="${i}" checked>${chip('Initial '+n0+' '+x.L*x.S,c0)}${chip('Residual '+n+' '+x.rL*x.rS,c)}${x.photo?chip('Photo '+x.photo):''}</div><div class="rc-title">${esc(x.hazard)}</div><div class="rc-sub">${esc(clip(x.description,160))}</div><div class="rc-x"><b>Controls:</b> ${esc(clip(x.addl,200))}</div></label>`}).join('')+`<label class="fld chk" style="margin-top:8px"><input type="checkbox" id="ra_act" checked> Also create an action for each selected item</label><button class="btn primary" id="ra_add" style="margin-top:6px">Add selected to register</button>`;
   $('#ra_add',el).onclick=()=>{let n=0;$$('input[data-i]:checked',el).forEach(cb=>{const x=items[+cb.dataset.i];const rec={id:uid(),ref:nextRef('R'),created:new Date().toISOString(),area:area||'General',category:RISK_CATS.includes(x.category)?x.category:RISK_CATS[0],hazard:x.hazard,description:x.description||'',existing:x.existing||'',L:x.L,S:x.S,addl:x.addl||'',rL:x.rL,rS:x.rS,owner:x.owner||'',review:addDays(null,90),status:'Open',photos:x.photo&&thumbs[x.photo-1]?[thumbs[x.photo-1]]:[]};
    S.risks.unshift(rec);n++;
    if($('#ra_act',el).checked)S.actions.unshift({id:uid(),ref:nextRef('ACT'),created:new Date().toISOString(),title:x.actionTitle||('Implement controls: '+x.hazard),area:area||'General',cat:'Corrective action',priority:PRI.includes(x.priority)?x.priority:'Medium',owner:x.owner||'',due:addDays(null,x.priority==='Critical'?3:x.priority==='High'?7:30),status:'Open',repeat:0,notes:'From risk '+rec.ref})});
    logAct('AI scan added '+n+' risks');save();refresh();el.remove();toast(n+' risk(s) added')}
  }catch(e){out.innerHTML='<p class="hint" style="color:var(--bad)">'+esc(errMsg(e))+'</p>'}}}

const IDB={db:null,last:0};
function idbOpen(){return new Promise(res=>{try{if(!window.indexedDB)return res(false);const r=indexedDB.open(window.__IDB||'csrm',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{IDB.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})}
const idbTx=(m,fn)=>new Promise((res,rej)=>{if(!IDB.db)return rej(new Error('no idb'));try{const t=IDB.db.transaction('kv',m);const r=fn(t.objectStore('kv'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}});
const idbPut=(k,v)=>idbTx('readwrite',s=>s.put(v,k));const idbGet=k=>idbTx('readonly',s=>s.get(k));const idbDel=k=>idbTx('readwrite',s=>s.delete(k));const idbKeys=()=>idbTx('readonly',s=>s.getAllKeys());
let mirrorT;function mirrorSoon(){clearTimeout(mirrorT);mirrorT=setTimeout(()=>{mirrorNow().catch(()=>{})},2000)}
async function mirrorNow(){if(!IDB.db)return;const P=IDP(),json=JSON.stringify(S),ts=Date.now();await idbPut(P+'state',{ts,json});await idbPut(P+'snap:'+today(),{ts,json});
 const ks=(await idbKeys()).map(String).filter(k=>k.startsWith(P)).map(k=>k.slice(P.length));const daily=ks.filter(k=>/^snap:\d{4}-/.test(k)).sort();while(daily.length>7)await idbDel(P+daily.shift());const pre=ks.filter(k=>k.startsWith('snap:pre-')).sort();while(pre.length>3)await idbDel(P+pre.shift());IDB.last=ts}
async function preRestoreSnap(){try{if(IDB.db)await idbPut(IDP()+'snap:pre-'+Date.now(),{ts:Date.now(),json:JSON.stringify(S)})}catch(e){}}

function applyState(R,label){R=R||{};S={...structuredClone(DEF),...R,profile:{...DEF.profile,...(R.profile||{})}};normalizeState();saveNow();brandUI();show(TAB);toast(label||'Restored')}

 if(ID.id){const ini=(ID.name||'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase().replace(/[^A-Z0-9]/g,'');const idc=String(ID.id).replace(/^u_/,'').replace(/[^a-z0-9]/gi,'').toUpperCase();ID.tag=ID.owner?'':((ini+idc).slice(0,3).padEnd(2,'X'))}

/* ---- sync engine ---- */
const wire=r=>{const o={};for(const k in r){if(k==='photos'||k==='_h'||k==='_mh')continue;o[k]=r[k]}o._ph=(r.photos&&r.photos.length)?r.photos.length:(r._ph||0);o._del=0;if(Array.isArray(o.items))o.items=o.items.map(i=>{const c={...i};c._ph=(i.photos||[]).length;delete c.photos;return c});return JSON.parse(JSON.stringify(o))};
function baseBucket(key,r){let d=r.created||r.dt||r.date||(typeof r.start==='number'?new Date(r.start).toISOString():'')||new Date().toISOString();d=String(d);if(key==='patrols')return d.slice(0,10);if(['roles','contacts','legal','chk'].includes(key))return 'all';return d.slice(0,7)}
function assignBucket(key,r){if(r._b)return r._b;const base=baseBucket(key,r),n=S[key].filter(x=>x._b&&x._b.split('~')[0]===base).length;const seg=Math.floor(n/(BLIM[key]||120));r._b=seg?base+'~'+seg:base;return r._b}
async function dbUpd(ref,d){try{await ref.update(d)}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*600));await ref.update(d)}else throw e}}
async function writeBucket(coll,b,recs,key){const path=coll+'/'+b,ref=CLOUD.db.doc(path);
 try{if(!SYNC.ex.has(path)){const s=await ref.get();if(s.exists)SYNC.ex.add(path)}if(SYNC.ex.has(path))await dbUpd(ref,{r:recs});else{await dbSet(ref,{r:recs});SYNC.ex.add(path)}return true}
 catch(e){if(e&&e.code==='invalid_argument'){SYNC.denied.add(key);if(!SYNC.warned){SYNC.warned=1;toast('Some changes could not be shared — your access level does not allow editing '+key+'. Ask the master.',6000)}return false}
  if(e&&e.code==='quota_exceeded'){SYNC.err='quota';toast('Shared storage is full — tell the master.',6000);return false}throw e}}
let syncT;function syncSoon(){if(!SYNC.on)return;clearTimeout(syncT);syncT=setTimeout(()=>{syncPush().catch(()=>{})},900)}
const saveLocal=()=>{clearTimeout(saveT);saveT=setTimeout(()=>saveNow(true),250)};
function cfgWire(){return JSON.parse(JSON.stringify({profile:{hotel:S.profile.hotel,context:S.profile.context,prefix:S.profile.prefix,role:S.profile.role},kpiTargets:S.kpiTargets,kpiVals:S.kpiVals,cover:S.cover,comp:S.comp,horizon:S.horizon}))}
async function pushCfg(){if(!isAdm())return;const w=cfgWire(),h=cyrb(JSON.stringify(w));if(S._cfgh===h)return;await dbSet(CLOUD.db.doc('cfg/workspace'),{...w,_u:Date.now(),_by:ID.id});S._cfgh=h}
function applyCfg(d){if(!d)return false;const w={};['profile','kpiTargets','kpiVals','cover','comp','horizon'].forEach(k=>{if(d[k]!==undefined)w[k]=d[k]});const h=cyrb(JSON.stringify(w));if(S._cfgh===h)return false;
 if(isAdm()&&S._cfgh&&cyrb(JSON.stringify(cfgWire()))!==S._cfgh)return false;
 if(w.profile)Object.assign(S.profile,w.profile);['kpiTargets','kpiVals','cover','comp','horizon'].forEach(k=>{if(w[k]!==undefined)S[k]=w[k]});S._cfgh=cyrb(JSON.stringify(cfgWire()));return true}
async function pushLive(){if(!mayAny())return;const ref=CLOUD.db.doc('live/crisis');if(S.crisis){const o={active:true,scen:S.crisis.scen,start:S.crisis.start,by:ID.id,log:S.crisis.log.slice(-25)};const h=cyrb(JSON.stringify(o));if(SYNC.liveH===h)return;await dbSet(ref,{...o,_u:Date.now()});SYNC.liveH=h;SYNC.liveOn=true}else if(SYNC.liveOn){await dbSet(ref,{active:false,_u:Date.now()});SYNC.liveOn=false;SYNC.liveH=null}}
async function pushMedia(){for(const key of SYNC_KEYS){if(!mayWrite(key))continue;for(const r of S[key]){const ph=r.photos;if(!ph||!ph.length||!r._u||r._h!==hashRec(r))continue;const mh=cyrb(ph.length+':'+ph.map(p=>p.length).join(','));if(r._mh===mh)continue;const arr=[...ph];while(arr.length&&JSON.stringify({k:key,p:arr}).length>235000)arr.pop();if(!arr.length)continue;try{await dbSet(CLOUD.db.doc('media/'+r.id),{k:key,p:arr,_u:Date.now()});r._mh=mh}catch(e){if(e&&e.code==='quota_exceeded')return}}}}
async function syncPush(){if(!SYNC.on||!CLOUD.db)return;if(SYNC.busy){SYNC.again=true;return}SYNC.busy=true;SYNC.err='';
 try{for(const key of SYNC_KEYS){if(SYNC.denied.has(key)||!mayWrite(key))continue;const coll=COLL[key],groups={},cur=new Set();S._ids[key]=S._ids[key]||{};
   for(const r of S[key]){cur.add(r.id);const h=hashRec(r);if(r._u&&r._h===h)continue;r._u=Date.now();r._by=ID.id;assignBucket(key,r);const g=groups[r._b]=groups[r._b]||{recs:{},done:[]};g.recs[r.id]=wire(r);g.done.push([r,h])}
   if(mayDel()){const map=S._ids[key];for(const id in map){if(!cur.has(id)){const b=map[id],g=groups[b]=groups[b]||{recs:{},done:[]};g.recs[id]={_del:1,_u:Date.now(),_by:ID.id};g.done.push([{id,_tomb:1},null])}}}
   for(const b in groups){const g=groups[b];if(await writeBucket(coll,b,g.recs,key)===false)break;for(const [r,h] of g.done){if(r._tomb)delete S._ids[key][r.id];else{r._h=h;S._ids[key][r.id]=r._b}}}}
  await pushMedia();await pushCfg();await pushLive();SYNC.last=Date.now();saveLocal()}
 catch(e){SYNC.err=(e&&e.code)||'error'}
 SYNC.busy=false;if(SYNC.again){SYNC.again=false;syncSoon()}}
function applyBucket(key,docId,data){let changed=false;const R=(data&&data.r)||{};const idx=new Map(S[key].map(r=>[r.id,r]));S._ids[key]=S._ids[key]||{};
 for(const id in R){const rr=R[id],loc=idx.get(id);
  if(rr._del){if(loc&&loc._h===hashRec(loc)&&(loc._u||0)<=rr._u){S[key]=S[key].filter(x=>x.id!==id);delete S._ids[key][id];changed=true}continue}
  if(!loc){const n={...rr,id};n.photos=[];n._h=hashRec(n);S[key].unshift(n);S._ids[key][id]=rr._b||docId;changed=true;continue}
  if(loc._h!==hashRec(loc))continue;
  if((rr._u||0)>(loc._u||0)){const ph=loc.photos,mh=loc._mh;for(const k of Object.keys(loc))delete loc[k];Object.assign(loc,rr,{id});loc.photos=ph||[];if(mh)loc._mh=mh;loc._h=hashRec(loc);S._ids[key][id]=loc._b||docId;changed=true}}
 for(const loc of S[key]){if(loc._b===docId&&loc._u&&loc._by===ID.id&&loc._h===hashRec(loc)&&!(loc.id in R)&&Date.now()-loc._u>15000){loc._h='';changed=true}}
 return changed}
